<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Market Monitor 速覽</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MM 速覽">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1318" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column. Signal lamp on top, four breadth tiles, 20-day bar chart, then folded detail. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #e4e9ee;
  --fg: #121c26;
  --muted: #5c6b79;
  --line: #d3dae1;
  --accent: #2c5fd6;
  --housing: #17212b;
  --lamp-off: #2b3844;
  --up: #14935a;
  --down: #d1403a;
  --mid: #c98b0e;
  --up-soft: #d9f0e5;
  --down-soft: #f9dcda;
  --mid-soft: #f6e8c9;
  --font-body: 'IBM Plex Sans', 'PingFang HK', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif;
  --font-num: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1318; --surface: #151d25; --surface-2: #1d2832; --fg: #e8edf1; --muted: #8fa0af;
    --line: #26323d; --accent: #7fa3ff; --housing: #070b0f; --lamp-off: #1f2a34;
    --up: #34c07f; --down: #ef6a63; --mid: #e3b04a;
    --up-soft: #113626; --down-soft: #3d1a19; --mid-soft: #3a2d10;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1318; --surface: #151d25; --surface-2: #1d2832; --fg: #e8edf1; --muted: #8fa0af;
  --line: #26323d; --accent: #7fa3ff; --housing: #070b0f; --lamp-off: #1f2a34;
  --up: #34c07f; --down: #ef6a63; --mid: #e3b04a;
  --up-soft: #113626; --down-soft: #3d1a19; --mid-soft: #3a2d10;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.title-row { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.01em; }
.asof { font-size: 12px; color: var(--muted); }
.asof b { color: var(--fg); font-weight: 500; }
.refresh {
  appearance: none; -webkit-appearance: none;
  border: 0; background: none; padding: 0; margin: 0;
  font: inherit; font-size: 12px; font-weight: 400; line-height: inherit;
  color: var(--accent); cursor: pointer;
}
.refresh:disabled { color: var(--muted); }
.refresh:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Signal lamp */
.signal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; gap: 16px; align-items: center; }
.housing { background: var(--housing); border-radius: 36px; padding: 10px 8px; display: flex; flex-direction: column; gap: 8px; flex: none; }
.lamp { width: 34px; height: 34px; border-radius: 50%; background: var(--lamp-off); transition: background .2s, box-shadow .2s; }
.lamp.on.g { background: var(--up); box-shadow: 0 0 18px 3px var(--up); }
.lamp.on.y { background: var(--mid); box-shadow: 0 0 18px 3px var(--mid); }
.lamp.on.r { background: var(--down); box-shadow: 0 0 18px 3px var(--down); }
.verdict { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.verdict .label { font-size: 34px; font-weight: 600; line-height: 1.05; letter-spacing: 0.02em; }
.verdict .label.g { color: var(--up); } .verdict .label.y { color: var(--mid); } .verdict .label.r { color: var(--down); }
.verdict .why { font-size: 13px; color: var(--muted); }
.verdict .hint { font-size: 12px; color: var(--muted); }
.verdict .hint.change { color: var(--fg); font-weight: 500; }
.verdict .rule { font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; }
.lamp.on.flash { animation: lamp-flash 0.8s ease-in-out 3; }
@keyframes lamp-flash {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.45); }
}

/* Tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 600; line-height: 1.15; margin-top: 2px; }
.tile .p { font-size: 11px; color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.v.up { color: var(--up); } .v.down { color: var(--down); }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.panel h2 { margin: 0 0 8px; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0.04em; display: flex; justify-content: space-between; gap: 8px; }
svg.chart { display: block; width: 100%; height: auto; }
svg.chart text { font-family: var(--font-num); font-size: 9px; fill: var(--muted); }
svg.chart .axis { stroke: var(--line); stroke-width: 1; }
svg.chart .bu { fill: var(--up); } svg.chart .bd { fill: var(--down); }
.strip { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin-top: 10px; }
.strip i { aspect-ratio: 1; border-radius: 3px; display: block; }
.strip i.g { background: var(--up); } .strip i.y { background: var(--mid); } .strip i.r { background: var(--down); }
.legend { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }

/* Folded detail */
details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
summary { list-style: none; cursor: pointer; padding: 12px; font-size: 13px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "展開"; font-size: 12px; color: var(--accent); font-weight: 400; }
details[open] summary::after { content: "收埋"; }
summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 12px; }
.sec { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.sec div { padding: 9px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
.sec div:nth-child(odd) { border-right: 1px solid var(--line); }
.sec .k { font-size: 11px; color: var(--muted); }
.sec .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; }
.sec .v small { color: var(--muted); font-weight: 400; font-size: 11px; }
.scroll { overflow-x: auto; border-top: 1px solid var(--line); }
table { border-collapse: collapse; width: 100%; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 12px; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-family: var(--font-body); font-weight: 500; color: var(--muted); font-size: 11px; background: var(--surface-2); }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
th:first-child { background: var(--surface-2); }
td .d { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
td .d.g { background: var(--up); } td .d.y { background: var(--mid); } td .d.r { background: var(--down); }
td.up { color: var(--up); } td.down { color: var(--down); }
.tag-ch { font-family: var(--font-body); font-size: 10px; color: var(--accent); margin-left: 4px; font-weight: 500; }
.foot { font-size: 11px; color: var(--muted); text-align: center; }

.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); }
.tab {
  appearance: none; -webkit-appearance: none;
  border: 0; background: none; padding: 8px 0 10px; margin: 0;
  font: inherit; font-size: 13px; font-weight: 500; color: var(--muted);
  cursor: pointer;
}
.tab.on { color: var(--fg); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.view { display: flex; flex-direction: column; gap: 12px; }
.view[hidden] { display: none !important; }

.stock-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.stock-name { font-size: 15px; font-weight: 600; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-size: 11px; color: var(--muted);
  background: var(--surface-2); border-radius: 999px; padding: 3px 8px;
}
.tag.up { color: var(--up); background: var(--up-soft); }
.tag.down { color: var(--down); background: var(--down-soft); }
.stock .tiles { margin-top: 10px; }
.stock .tile { background: var(--surface-2); border: 0; border-radius: 10px; padding: 8px 10px; }
.stock .tile .k { font-size: 11px; }
.stock .tile .v { font-size: 18px; }
.stock .tile .p { font-family: var(--font-body); }
.p.up { color: var(--up); } .p.down { color: var(--down); } .p.mid { color: var(--mid); }
.stock ul { margin: 10px 0 0; padding-left: 18px; font-size: 13px; }
.stock li { margin: 0 0 6px; }
.stock li:last-child { margin-bottom: 0; }
.src { font-size: 11px; color: var(--muted); margin-top: 8px; }
.earn-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.earn-row:first-of-type { padding-top: 0; }
.earn-row:last-of-type { border-bottom: 0; padding-bottom: 0; }
.when {
  flex: none; min-width: 44px; text-align: center;
  font-family: var(--font-num); font-variant-numeric: tabular-nums;
  font-size: 12px; font-weight: 500;
  background: var(--surface-2); border-radius: 8px; padding: 6px 8px;
}
.earn-row .nm { font-weight: 500; }
.earn-row .nt { font-size: 12px; color: var(--muted); margin-top: 2px; }
.note { font-size: 11px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="title-row">
      <h1>Market Monitor 速覽</h1>
      <button type="button" class="refresh" id="refresh">更新</button>
    </div>
    <div class="asof"><span id="asof-k">數據日期</span> <b class="num" id="asof">–</b> · <span id="src">載入中</span></div>
  </header>

  <nav class="tabs" aria-label="分頁">
    <button type="button" class="tab on" id="tab-lamp" aria-selected="true">燈號</button>
    <button type="button" class="tab" id="tab-earn" aria-selected="false">業績</button>
  </nav>

  <div class="foot" id="err" hidden></div>

  <div class="view" id="view-lamp">
  <section class="signal" aria-live="polite">
    <div class="housing" aria-hidden="true">
      <div class="lamp" id="lg"></div>
      <div class="lamp" id="ly"></div>
      <div class="lamp" id="lr"></div>
    </div>
    <div class="verdict">
      <div class="label" id="vlabel">–</div>
      <div class="why num" id="vwhy">–</div>
      <div class="hint" id="vhint"></div>
    </div>
  </section>

  <section class="tiles">
    <div class="tile"><div class="k">今日升 4%+</div><div class="v up" id="t-up">–</div><div class="p" id="p-up"></div></div>
    <div class="tile"><div class="k">今日跌 4%+</div><div class="v down" id="t-dn">–</div><div class="p" id="p-dn"></div></div>
    <div class="tile"><div class="k">5 日比率</div><div class="v" id="t-r5">–</div><div class="p" id="p-r5"></div></div>
    <div class="tile"><div class="k">10 日比率</div><div class="v" id="t-r10">–</div><div class="p" id="p-r10"></div></div>
  </section>

  <section class="panel">
    <h2><span>近 20 日 4%+ 升跌股數</span><span class="num" id="chartmax"></span></h2>
    <svg class="chart" id="chart" viewBox="0 0 340 130" role="img" aria-label="近 20 日每日升 4% 以上與跌 4% 以上股數"></svg>
    <div class="strip" id="strip" aria-hidden="true"></div>
    <div class="legend"><span id="d0"></span><span>每格 = 一個交易日的燈號</span><span id="d1"></span></div>
  </section>

  <details>
    <summary>次要指標</summary>
    <div class="sec" id="sec"></div>
  </details>

  <details>
    <summary><span>歷史明細 <span class="num" id="histn"></span></span></summary>
    <div class="scroll"><table id="tbl"></table></div>
  </details>

  <div class="foot">數據來自 Stockbee Market Monitor 公開表格，只供自己參考。</div>
  </div>

  <div class="view" id="view-earn" hidden>
    <div id="earn-list"></div>
    <div class="foot" id="earn-err" hidden></div>
    <div class="foot">數據由業績期追蹤整理，只供自己參考。</div>
  </div>
</div>

<script>
(function () {
  var SHEET = '1O6OhS7ciA8zwfycBfGPbP2fWJnR0pn2UUvFZVDP9jpE';
  var GID = '1082103394';
  // Signal rule lives here so it can be swapped in one place.
  // Rule: stocks up 25%+ in a quarter vs stocks down 25%+ in a quarter.
  function signal(r) {
    if (r[5] > r[6]) return 'g';
    if (r[5] < r[6]) return 'r';
    return 'y';
  }
  var NAME = { g: '偏多', y: '分歧', r: '偏空' };

  function $(id) { return document.getElementById(id); }
  function fmt(n) { return Number(n).toLocaleString('en-US'); }
  function f2(n) { return Number(n).toFixed(2); }
  function fmtDelta(n) {
    var sign = n > 0 ? '+' : (n < 0 ? '−' : '');
    return sign + fmt(Math.abs(n));
  }
  function yearOf(d) {
    var m = /\/(\d{4})$/.exec(d || '');
    return m ? m[1] : '';
  }
  function fmtDate(s, refYear) {
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s || '');
    if (!m) return s || '';
    if (refYear && m[3] === refYear) return m[1] + '/' + m[2];
    return m[1] + '/' + m[2] + '/' + m[3].slice(2);
  }

  function parseCSV(text) {
    var rows = [], row = [], cell = '', q = false, i, c;
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else if (c !== '\r') cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }
  function toRows(csv) {
    var out = [];
    parseCSV(csv).forEach(function (r) {
      if (!/^\d{1,2}\/\d{1,2}\/\d{4}$/.test((r[0] || '').trim())) return;
      var n = [r[0].trim()];
      for (var i = 1; i < 16; i++) n.push(parseFloat(String(r[i] || '').replace(/,/g, '')));
      // sheet has a "universe" column at index 13; drop it to match the row layout
      out.push(n.slice(0, 13).concat([n[14], n[15]]));
    });
    return out;
  }

  function showError(msg) {
    $('src').textContent = '讀取失敗';
    var el = $('err');
    el.hidden = false;
    el.textContent = msg;
  }

  function render(data, live) {
    $('err').hidden = true;
    $('err').textContent = '';
    var d = data.slice(0, 20), t = d[0], y = d[1] || t, s = signal(t);
    var refY = yearOf(t[0]);
    var margin = t[5] - t[6];
    var todayChanged = data.length > 1 && s !== signal(data[1]);
    $('asof').textContent = t[0];
    $('src').textContent = live ? '實時' : '示例數據';

    ['g', 'y', 'r'].forEach(function (k) {
      var el = $({ g: 'lg', y: 'ly', r: 'lr' }[k]);
      el.className = 'lamp ' + k + (k === s ? ' on' : '') + (k === s && todayChanged ? ' flash' : '');
    });
    var lab = $('vlabel'); lab.textContent = NAME[s]; lab.className = 'label ' + s;
    $('vwhy').textContent = '季升25%+ ' + fmt(t[5]) + ' vs 季跌25%+ ' + fmt(t[6]) + '（邊際 ' + fmtDelta(margin) + '）';

    var hint = $('vhint');
    var streak = 1, prevSig = null, changeDate = '';
    for (var i = 1; i < data.length; i++) {
      if (signal(data[i]) === s) streak++;
      else { prevSig = signal(data[i]); changeDate = data[i - 1][0]; break; }
    }
    if (todayChanged) {
      hint.textContent = '今日由' + NAME[signal(data[1])] + '轉為' + NAME[s];
      hint.className = 'hint change';
    } else if (prevSig) {
      hint.textContent = NAME[s] + '已連續 ' + streak + ' 日。上次轉色：' + fmtDate(changeDate, refY) + '，由' + NAME[prevSig] + '轉為' + NAME[s];
      hint.className = 'hint';
    } else {
      hint.textContent = NAME[s] + '已連續 ' + streak + ' 日';
      hint.className = 'hint';
    }

    $('t-up').textContent = fmt(t[1]); $('p-up').textContent = '昨日 ' + fmt(y[1]);
    $('t-dn').textContent = fmt(t[2]); $('p-dn').textContent = '昨日 ' + fmt(y[2]);
    var r5 = $('t-r5'), r10 = $('t-r10');
    r5.textContent = f2(t[3]); r5.className = 'v ' + (t[3] >= 1 ? 'up' : 'down'); $('p-r5').textContent = '昨日 ' + f2(y[3]);
    r10.textContent = f2(t[4]); r10.className = 'v ' + (t[4] >= 1 ? 'up' : 'down'); $('p-r10').textContent = '昨日 ' + f2(y[4]);

    // chart: oldest on the left, up bars above the axis, down bars below
    var ch = d.slice().reverse(), W = 340, H = 130, mid = 65, half = 56;
    var max = Math.max.apply(null, ch.map(function (r) { return Math.max(r[1], r[2]); }));
    var step = W / ch.length, bw = Math.max(6, step - 5), g = '';
    g += '<line class="axis" x1="0" x2="' + W + '" y1="' + mid + '" y2="' + mid + '"/>';
    ch.forEach(function (r, i) {
      var x = i * step + (step - bw) / 2, hu = r[1] / max * half, hd = r[2] / max * half;
      g += '<rect class="bu" x="' + x.toFixed(1) + '" y="' + (mid - hu).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hu.toFixed(1) + '" rx="1.5"/>';
      g += '<rect class="bd" x="' + x.toFixed(1) + '" y="' + (mid + 1).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hd.toFixed(1) + '" rx="1.5"/>';
    });
    $('chart').innerHTML = g;
    $('chartmax').textContent = '最高 ' + fmt(max);

    $('strip').innerHTML = ch.map(function (r) { return '<i class="' + signal(r) + '" title="' + r[0] + '"></i>'; }).join('');
    $('d0').textContent = fmtDate(ch[0][0], refY);
    $('d1').textContent = fmtDate(ch[ch.length - 1][0], refY);

    var sec = [
      ['T2108', f2(t[13]) + '%', ''],
      ['S&P', fmt(t[14]), ''],
      ['季升 25%+', fmt(t[5]), ''],
      ['季跌 25%+', fmt(t[6]), ''],
      ['月升 25%+', fmt(t[7]), ''],
      ['月跌 25%+', fmt(t[8]), ''],
      ['月升 50%+', fmt(t[9]), ''],
      ['月跌 50%+', fmt(t[10]), ''],
      ['34 日升 13%+', fmt(t[11]), ''],
      ['34 日跌 13%+', fmt(t[12]), '']
    ];
    $('sec').innerHTML = sec.map(function (p) {
      return '<div><div class="k">' + p[0] + '</div><div class="v' + (p[2] ? ' ' + p[2] : '') + '">' + p[1] + '</div></div>';
    }).join('');

    $('histn').textContent = '（' + data.length + ' 日）';
    var th = '<tr><th>日期</th><th>升4%</th><th>跌4%</th><th>5日</th><th>10日</th><th>季升</th><th>季減</th><th>T2108</th><th>S&amp;P</th></tr>';
    var tb = data.map(function (r, i) {
      var rs = signal(r);
      var ch = (i + 1 < data.length && rs !== signal(data[i + 1]));
      return '<tr' + (ch ? ' class="chg"' : '') + '><td><span class="d ' + rs + '"></span>' + fmtDate(r[0], refY) +
        (ch ? '<span class="tag-ch">轉</span>' : '') + '</td>' +
        '<td class="up">' + fmt(r[1]) + '</td><td class="down">' + fmt(r[2]) + '</td>' +
        '<td class="' + (r[3] >= 1 ? 'up' : 'down') + '">' + f2(r[3]) + '</td>' +
        '<td class="' + (r[4] >= 1 ? 'up' : 'down') + '">' + f2(r[4]) + '</td>' +
        '<td class="up">' + fmt(r[5]) + '</td><td class="down">' + fmt(r[6]) + '</td>' +
        '<td>' + f2(r[13]) + '</td><td>' + fmt(r[14]) + '</td></tr>';
    }).join('');
    $('tbl').innerHTML = th + tb;
  }

  // Live data from the public sheet. On failure, show a reason and do not fall back to sample data.
  try {
    fetch('https://docs.google.com/spreadsheets/d/' + SHEET + '/gviz/tq?tqx=out:csv&gid=' + GID, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (txt) {
        var rows = toRows(txt);
        if (!rows.length) {
          showError('讀取失敗：表格沒有有效日期列');
          return;
        }
        render(rows, true);
      })
      .catch(function (e) {
        var m = (e && e.message) ? String(e.message) : '';
        if (/^HTTP\s+\d+/.test(m)) showError('讀取失敗：' + m);
        else if (!m || /failed to fetch|networkerror|load failed/i.test(m)) showError('讀取失敗：網絡或跨域限制');
        else showError('讀取失敗：' + m);
      });
  } catch (e) {
    var m = (e && e.message) ? String(e.message) : '未知錯誤';
    showError('讀取失敗：' + m);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function tone(v) { return v === 'up' || v === 'down' || v === 'mid' ? v : ''; }

  var currentTab = 'lamp';
  var earnData = null;
  var lampAsof = { k: '數據日期', d: '–', s: '載入中' };

  var origRender = render;
  render = function (data, live) {
    origRender(data, live);
    lampAsof = { k: '數據日期', d: $('asof').textContent, s: $('src').textContent };
  };
  var origShowError = showError;
  showError = function (msg) {
    origShowError(msg);
    lampAsof = { k: '數據日期', d: $('asof').textContent, s: $('src').textContent };
    if (currentTab === 'earn') $('err').hidden = true;
  };

  function applyHeader() {
    if (currentTab === 'earn') {
      $('asof-k').textContent = '更新時間';
      if (earnData) {
        $('asof').textContent = earnData.updatedLabel || '–';
        $('src').textContent = '業績';
      } else if ($('earn-err') && !$('earn-err').hidden && $('earn-err').textContent) {
        $('asof').textContent = '–';
        $('src').textContent = '讀取失敗';
      } else {
        $('asof').textContent = '–';
        $('src').textContent = '載入中';
      }
      $('err').hidden = true;
    } else {
      $('asof-k').textContent = lampAsof.k;
      $('asof').textContent = lampAsof.d;
      $('src').textContent = lampAsof.s;
      var e = $('err');
      e.hidden = !e.textContent;
    }
  }

  function showTab(name) {
    currentTab = name === 'earn' ? 'earn' : 'lamp';
    $('tab-lamp').className = 'tab' + (currentTab === 'lamp' ? ' on' : '');
    $('tab-earn').className = 'tab' + (currentTab === 'earn' ? ' on' : '');
    $('tab-lamp').setAttribute('aria-selected', currentTab === 'lamp' ? 'true' : 'false');
    $('tab-earn').setAttribute('aria-selected', currentTab === 'earn' ? 'true' : 'false');
    $('view-lamp').hidden = currentTab !== 'lamp';
    $('view-earn').hidden = currentTab !== 'earn';
    applyHeader();
    var hash = currentTab === 'earn' ? '#業績' : '#燈號';
    if (decodeURIComponent(location.hash || '') !== hash) history.replaceState(null, '', hash);
  }

  function renderEarn(data) {
    earnData = data;
    var el = $('earn-list');
    var err = $('earn-err');
    err.hidden = true;
    err.textContent = '';
    var html = '';
    (data.stocks || []).forEach(function (s) {
      html += '<article class="panel stock">';
      html += '<div class="stock-head"><div class="stock-name">' + esc(s.name) + '</div><div class="tags">';
      if (s.date) html += '<span class="tag">' + esc(s.date) + '</span>';
      if (s.change) html += '<span class="tag ' + tone(s.changeTone) + '">' + esc(s.change) + '</span>';
      html += '</div></div><div class="tiles">';
      (s.metrics || []).forEach(function (m) {
        html += '<div class="tile"><div class="k">' + esc(m.label) + '</div>';
        html += '<div class="v">' + esc(m.value) + '</div>';
        html += '<div class="p ' + tone(m.noteTone) + '">' + esc(m.note) + '</div></div>';
      });
      html += '</div>';
      if (s.bullets && s.bullets.length) {
        html += '<ul>' + s.bullets.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>';
      }
      if (s.source) html += '<div class="src">' + esc(s.source) + '</div>';
      html += '</article>';
    });
    if (data.upcoming && data.upcoming.length) {
      html += '<section class="panel"><h2>本週即將公布</h2>';
      data.upcoming.forEach(function (u) {
        html += '<div class="earn-row"><div class="when">' + esc(u.date) + '</div><div>';
        html += '<div class="nm">' + esc(u.name) + '</div>';
        if (u.note) html += '<div class="nt">' + esc(u.note) + '</div>';
        html += '</div></div>';
      });
      if (data.upcomingNote) html += '<div class="note">' + esc(data.upcomingNote) + '</div>';
      html += '</section>';
    }
    if (data.focus) {
      html += '<section class="panel"><strong>市場焦點：</strong>' + esc(data.focus) + '</section>';
    }
    el.innerHTML = html;
    if (currentTab === 'earn') applyHeader();
  }

  function showEarnError(msg) {
    $('earn-list').innerHTML = '';
    var err = $('earn-err');
    err.hidden = false;
    err.textContent = msg;
    if (currentTab === 'earn') {
      $('asof-k').textContent = '更新時間';
      $('asof').textContent = '–';
      $('src').textContent = '讀取失敗';
    }
  }

  fetch('earnings.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      if (!data || !data.stocks || !data.stocks.length) {
        showEarnError('讀取失敗：業績資料是空的');
        return;
      }
      renderEarn(data);
    })
    .catch(function (e) {
      var m = (e && e.message) ? String(e.message) : '';
      if (/^HTTP\s+\d+/.test(m)) showEarnError('讀取失敗：' + m);
      else showEarnError('讀取失敗：網絡或檔案未能載入');
    });

  $('tab-lamp').addEventListener('click', function () { showTab('lamp'); });
  $('tab-earn').addEventListener('click', function () { showTab('earn'); });
  window.addEventListener('hashchange', function () {
    showTab(decodeURIComponent(location.hash) === '#業績' ? 'earn' : 'lamp');
  });
  if (decodeURIComponent(location.hash) === '#業績') showTab('earn');

  $('refresh').addEventListener('click', function () {
    this.disabled = true;
    this.textContent = '更新中';
    var u = new URL(location.href);
    u.searchParams.set('r', String(Date.now()));
    location.replace(u.toString());
  });
})();
</script>

</body>
</html>
